<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="{{ .Site.Home.RelPermalink }}">
      <span class="logo-text">ARES</span>
      <span class="logo-sub">Docs</span>
    </a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relLangURL }}" {{ if $.IsMenuCurrent "main" . }}class="nav-active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
