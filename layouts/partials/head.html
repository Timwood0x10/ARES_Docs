<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ block "title" . }}{{ .Title }}{{ if .IsHome }}{{ else }} | {{ .Site.Title }}{{ end }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

{{ $css := resources.Get "css/main.css" | toCSS | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">

<!-- No-FOUC: set theme before CSS paints -->
<script>
(function () {
  var saved = localStorage.getItem('theme');
  if (!saved) {
    saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', saved);
})();
</script>

<!-- Mermaid diagram rendering -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function () {
  function mermaidTheme(theme) {
    return theme === 'dark' ? 'dark' : 'default';
  }

  function initMermaid() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    // securityLevel 'loose' allows click interactions on diagram nodes.
    mermaid.initialize({
      startOnLoad: false,
      theme: mermaidTheme(isDark ? 'dark' : 'light'),
      securityLevel: 'loose'
    });
  }

  // Hugo renders ```mermaid blocks as <code class="language-mermaid">.
  // Convert them to <pre class="mermaid"> before calling mermaid.run(),
  // and stash the original source so theme toggles can re-render cleanly.
  function convertMermaidBlocks() {
    document.querySelectorAll('code.language-mermaid').forEach(function (el) {
      var source = el.textContent;
      var pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = source;
      pre.setAttribute('data-source', source);
      el.parentNode.replaceWith(pre);
    });
  }

  function renderMermaid() {
    if (window.mermaid) {
      mermaid.run({ querySelector: '.mermaid' });
    }
  }

  function rerenderMermaid() {
    document.querySelectorAll('.mermaid').forEach(function (el) {
      el.removeAttribute('data-processed');
      el.innerHTML = '';
      el.textContent = el.getAttribute('data-source') || el.textContent;
    });
    renderMermaid();
  }

  document.addEventListener('DOMContentLoaded', function () {
    initMermaid();
    convertMermaidBlocks();
    renderMermaid();

    // Theme toggle: persist and re-render Mermaid in place (no full reload).
    var btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        initMermaid();
        rerenderMermaid();
      });
    }
  });
})();
</script>

<!-- Mobile sidebar navigation toggle -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var toggle = document.getElementById('nav-toggle');
  var sidebar = document.getElementById('sidebar-nav');
  var backdrop = document.getElementById('sidebar-backdrop');
  if (!toggle || !sidebar) return;

  function setSidebar(open) {
    sidebar.classList.toggle('sidebar-open', open);
    toggle.classList.toggle('nav-toggle-active', open);
    toggle.setAttribute('aria-expanded', String(open));
    if (backdrop) backdrop.classList.toggle('sidebar-open', open);
  }
  function closeSidebar() { setSidebar(false); }

  toggle.addEventListener('click', function () {
    setSidebar(!sidebar.classList.contains('sidebar-open'));
  });

  // Clicking the backdrop closes the drawer.
  if (backdrop) backdrop.addEventListener('click', closeSidebar);

  // Close the sidebar when a link inside it is followed (mobile only matters,
  // but harmless on desktop where the sidebar is always visible).
  sidebar.addEventListener('click', function (e) {
    if (e.target.closest('a')) closeSidebar();
  });

  // Close on Escape and when the viewport grows back to desktop.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSidebar();
  });
  window.addEventListener('resize', function () {
    if (window.innerWidth > 900) closeSidebar();
  });
});
</script>
