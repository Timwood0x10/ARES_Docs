# Build and deploy the ARES documentation site to GitHub Pages.
# This workflow lives inside the Ares_docs project (an independent repo),
# so it only builds and deploys documentation - it does not touch the ARES
# Go source tree.
name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one deployment runs per branch, cancelling stale runs.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Hugo directly from upstream releases. The peaceiris/actions-hugo
      # action is unmaintained and still runs on Node 20, which triggers the
      # GitHub Actions Node 20 deprecation warning. A direct install avoids
      # that entirely and pins an exact extended binary.
      - name: Install Hugo (extended)
        run: |
          set -euo pipefail
          ARCH="linux-amd64"
          TARBALL="hugo_extended_${HUGO_VERSION}_${ARCH}.tar.gz"
          DOWNLOAD_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${TARBALL}"
          curl -fsSL -o "/tmp/${TARBALL}" "${DOWNLOAD_URL}"
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "/tmp/${TARBALL}" -C "${HOME}/.local/bin" hugo
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          hugo version

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
